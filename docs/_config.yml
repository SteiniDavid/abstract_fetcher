title: Paper Digests
description: Daily curated paper digests on research topics
baseurl: "/abstract_fetcher"
url: "https://steinidavid.github.io"

# Build settings
markdown: kramdown
highlighter: rouge

# Collections
collections:
  digests:
    output: true
    permalink: /digests/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "digests"
    values:
      layout: "digest"

# Plugins
plugins: []

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
