title: Paper Digests
description: Daily curated paper digests on research topics
baseurl: "/abstract_fetcher"
url: "https://steinidavid.github.io"

# Build settings
markdown: kramdown
highlighter: rouge

# Theme
remote_theme: pages-themes/minimal@v0.2.0

# Collections
collections:
  digests:
    output: true
    permalink: /digests/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "digests"
    values:
      layout: "digest"

# Sass
sass:
  style: compressed

# Plugins
plugins:
  - jekyll-remote-theme

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
