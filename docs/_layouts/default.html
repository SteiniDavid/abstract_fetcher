<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Georgia', 'Times New Roman', 'serif'],
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            'header': '#2c5282',
            'header-dark': '#2d3748',
            'accent': '#4a90a4',
            'accent-dark': '#76c7d4',
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer base {
      /* Index page list styling */
      main > ul {
        @apply list-none p-0;
      }
      main > ul > li {
        @apply py-2 border-b border-slate-200 dark:border-slate-700 last:border-b-0;
      }
      main > ul > li > a {
        @apply text-header dark:text-accent-dark no-underline hover:underline;
      }

      /* Digest content styling */
      .digest-content {
        @apply leading-relaxed;
      }
      .digest-content h2 {
        @apply font-sans font-semibold text-lg mt-10 mb-4 p-4 pl-5
               bg-slate-50 dark:bg-slate-800
               border-l-4 border-accent dark:border-accent-dark
               rounded-r text-slate-800 dark:text-slate-100;
      }
      .digest-content h3 {
        @apply font-sans font-semibold text-sm text-slate-500 dark:text-slate-400
               mt-5 mb-2 uppercase tracking-wide;
      }
      .digest-content p {
        @apply my-3 text-slate-700 dark:text-slate-300;
      }
      .digest-content a {
        @apply text-header dark:text-accent-dark no-underline hover:underline;
      }
      .digest-content strong {
        @apply font-semibold text-slate-800 dark:text-slate-200;
      }
      .digest-content hr {
        @apply border-0 border-t border-slate-200 dark:border-slate-700 my-8;
      }
      .digest-content blockquote {
        @apply my-2 p-4 bg-slate-50 dark:bg-slate-800 rounded text-sm
               border-l-0 not-italic text-slate-600 dark:text-slate-400;
      }
      .digest-content ul {
        @apply list-disc pl-6 my-3;
      }
      .digest-content li {
        @apply my-1;
      }

      /* Headings general */
      h1, h2, h3, h4, h5, h6 {
        @apply font-sans font-semibold leading-tight;
      }
    }
  </style>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="font-serif text-slate-700 dark:text-slate-200 leading-relaxed bg-white dark:bg-slate-900 min-h-screen">
  <header class="bg-header dark:bg-header-dark text-white py-8 mb-8">
    <div class="max-w-4xl mx-auto px-6 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-sans font-semibold m-0">
          <a href="{{ '/' | relative_url }}" class="text-white hover:opacity-90 no-underline">{{ site.title }}</a>
        </h1>
        <p class="mt-2 opacity-90 text-base m-0">{{ site.description }}</p>
      </div>
      <button id="theme-toggle" aria-label="Toggle dark mode" class="bg-transparent border border-white/30 rounded-md p-2 cursor-pointer text-white flex items-center justify-center hover:bg-white/10 transition-colors">
        <svg class="icon-sun hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg class="icon-moon block dark:hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6">
    {{ content }}
  </main>

  <footer class="max-w-4xl mx-auto px-6 mt-12 py-6 border-t border-slate-200 dark:border-slate-700 text-sm text-slate-500 dark:text-slate-400 text-center">
  </footer>

  <script>
    (function() {
      var toggle = document.getElementById('theme-toggle');
      toggle.addEventListener('click', function() {
        var isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    })();
  </script>
</body>
</html>
