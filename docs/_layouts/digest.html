---
layout: default
---

<article>
  <header class="mb-6">
    <h1 class="font-sans font-semibold text-3xl mb-1 text-slate-800 dark:text-slate-100">{{ page.title }}</h1>
    <time datetime="{{ page.date }}" class="text-sm text-slate-500 dark:text-slate-400">{{ page.date }}</time>
  </header>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 my-6 mb-8">
    <div class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-4 text-center">
      <span class="block text-3xl font-bold text-header dark:text-accent-dark font-sans">{{ page.num_selected }}</span>
      <span class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Selected</span>
    </div>
    <div class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-4 text-center">
      <span class="block text-3xl font-bold text-header dark:text-accent-dark font-sans">{{ page.num_downloaded }}</span>
      <span class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Downloaded</span>
    </div>
    <div class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-4 text-center">
      <span class="block text-3xl font-bold text-header dark:text-accent-dark font-sans">{{ page.num_abstracts }}</span>
      <span class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Abstracts</span>
    </div>
    <div class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-4 text-center">
      <span class="block text-3xl font-bold text-header dark:text-accent-dark font-sans">{{ page.num_candidates }}</span>
      <span class="block text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 mt-1">Candidates</span>
    </div>
  </div>

  <div class="digest-content">
    {{ content }}
  </div>

  <nav class="mt-12 pt-6 border-t border-slate-200 dark:border-slate-700">
    <a href="{{ '/' | relative_url }}" class="text-header dark:text-accent-dark hover:underline">&larr; Back to all digests</a>
  </nav>
</article>
